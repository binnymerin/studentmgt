<!doctype html>
{% load static %}
<html lang="en">
  <head>
  	<title>View teachers</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="{% static 'teachers/css/style.css' %}">

	</head>
	<body>
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">View Teachers</h2>
				</div>
			</div>
			<div class="row">
				<div class="col-md-12">
					<div class="table-wrap">
						<table class="table">
						  <thead class="thead-primary">
						    <tr>
						      <th>#</th>
						      <th>Name</th>
								<th>Address</th>
						      <th>Gender</th>
								<th>Pincode</th>
						      <th>Class</th>
						      <th>Phoneno</th>
						      <th>Password</th>
								<th>Email</th>

						    </tr>
						  </thead>
						  <tbody>
						  {% for i in tchr %}
						    <tr>
						      <th scope="row">{{forloop.counter}}</th>
						      <td>{{i.name}}</td>
						      <td>{{i.address}}</td>
						      <td>{{i.gender}}</td>
						      <td>{{i.pincode}}</td>
						      <td>{{i.Class}}</td>
								<td>{{i.phoneno}}</td>
						      <td>{{i.password}}</td>
						      <td>{{i.email}}</td>
						    </tr>
						    {% endfor %}


						  </tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="{% static 'teachers/js/jquery.min.js' %}"></script>
  <script src="{% static 'teachers/js/popper.js' %}"></script>
  <script src="{% static 'teachers/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'teachers/js/main.js' %}"></script>

	</body>
</html>

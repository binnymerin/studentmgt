<!doctype html>
{% load static %}
<html lang="en">
  <head>
  	<title>Table 01</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="{% static 'students/css/style.css' %}">

	</head>
	<body>
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">View Teacher Leave</h2>
				</div>
			</div>
			<div class="row">
				<div class="col-md-12">
					<div class="table-wrap">
						<table class="table">
						  <thead class="thead-primary">
						    <tr>
						      <th>#</th>
						      <th>Name</th>
								<th>Email</th>
						      <th>Phoneno</th>
						      <th>Date</th>
								<th>Reason</th>
						      <th>Status</th>
								<th>Action</th>
								<th></th>


						    </tr>
						  </thead>
						  <tbody>
						  {% for i in tchrleave %}
						    <tr>
						      <th scope="row">{{forloop.counter}}</th>
						      <td>{{i.name}}</td>
						      <td>{{i.email}}</td>
						      <td>{{i.phoneno}}</td>
								<td>{{i.date}}</td>
						      <td>{{i.reason}}</td>
								<td>{{i.status}}</td>
								<td><a href="/app_tchr/{{i.id}}/" >approve</a></td>

								<td><a href="/rej_tchr/{{i.id}}/" >reject</a></td>
						    </tr>
						    {% endfor %}


						  </tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="{% static 'students/js/jquery.min.js' %}"></script>
  <script src="{% static 'students/js/popper.js' %}"></script>
  <script src="{% static 'students/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'students/js/main.js' %}"></script>

	</body>
</html>

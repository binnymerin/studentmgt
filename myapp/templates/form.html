<!doctype html>
{% load static %}
<html lang="en">
  <head>
  	<title>Contact Form 10</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="{% static 'form/css/style.css' %}">

	</head>
	<body>
	<section class="ftco-section img bg-hero" style="background-image: url('{% static 'form/images/bg_1.jpg' %}');">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">Apply Leave Form</h2>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-lg-11">
					<div class="wrapper">
						<div class="row no-gutters justify-content-between">

			          </div>
						<form method="POST">
										{% csrf_token %}
										<div class="row">
											<div class="col-md-8">
												<div class="form-group">
													<input type="text" class="form-control" name="name" id="name" placeholder="Name">
												</div>
											</div>
											<div class="col-md-8">
												<div class="form-group">
													<input type="email" class="form-control" name="email" id="email" placeholder="Email">
												</div>
											</div>
											<div class="col-md-8">
												<div class="form-group">
													<input type="text" class="form-control" name="phoneno" id="phoneno" placeholder="Phoneno">
												</div>
											</div>
											<div class="col-md-8">
												<div class="form-group">
													<input type="date" class="form-control" name="date" id="date" placeholder="date">
												</div>
											</div>

											<div class="col-md-8">
												<div class="form-group">
													<textarea name="reason" class="form-control" id="reason" cols="30" rows="5" placeholder="Reason"></textarea>
												</div>
											</div>
											<div class="col-md-8">
												<div class="form-group">
													<input name="submit" type="submit" value="submit" class="btn btn-primary">
													<div class="submitting"></div>
												</div>
											</div>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="{% static 'form/js/jquery.min.js' %}"></script>
  <script src="{% static 'form/js/popper.js' %}"></script>
  <script src="{% static 'form/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'form/js/jquery.validate.min.js' %}"></script>
  <script src="{% static 'form/js/main.js' %}"></script>

	</body>
</html>

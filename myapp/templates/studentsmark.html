<!doctype html>
{% load static %}
<html lang="en">
  <head>
  	<title>Table 01</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="{% static 'studentsmark/css/style.css' %}">

	</head>
	<body>
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">Students Mark</h2>
				</div>
			</div>
			<div class="row">
				<div class="col-md-12">
					<div class="table-wrap">
						<table class="table">
						  <thead class="thead-primary">
						    <tr>
						      <th>#</th>
						      <th>Student Name</th>
						      <th>Subject</th>
						      <th>Mark</th>
								<th>Grade</th>
						    </tr>
						  </thead>
						  <tbody>
						  {% for i in ma %}
						    <tr>
						      <th scope="row">{{forloop.counter}}</th>
						      <td>{{i.student}}</td>
						      <td>{{i.subject}}</td>
						      <td>{{i.mark}}</td>
								<td>{{i.grade}}</td>
						    </tr>
						   {% endfor %}



						  </tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="{% static 'studentsmarkjs/jquery.min.js' %}"></script>
  <script src="{% static 'studentsmarkjs/popper.js' %}"></script>
  <script src="{% static 'studentsmarkjs/bootstrap.min.js' %}"></script>
  <script src="{% static 'studentsmarkjs/main.js' %}"></script>

	</body>
</html>

<!doctype html>
{% load static %}
<html lang="en">
  <head>
  	<title>Contact Form 04</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet' type='text/css'>

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="{% static 'timetab/css/style.css' %}">

	</head>
	<body>
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section">Add Timetable</h2>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-10">
					<div class="wrapper">
						<div class="row no-gutters">
							<div class="col-md-6">
								<div class="contact-wrap w-100 p-lg-5 p-4">
									<h3 class="mb-4">Timetab</h3>
									<div id="form-message-warning" class="mb-4"></div> 
				      		<div id="form-message-success" class="mb-4">
				            Your message was sent, thank you!
				      		</div>
									<form method="POST" class="contactForm">
										{% csrf_token %}
										<div class="row">
											<div class="col-md-12">
												<div class="form-group">
													<input type="date" class="form-control" name="date" id="date" placeholder="date">
												</div>
											</div>
											<div class="col-md-12"> 
												<div class="form-group">
													<input type="text" class="form-control" name="teachername" id="teachername" placeholder="teachername">
												</div>
											</div>
											<div class="col-md-12">
												<div class="form-group">
													<input type="text" class="form-control" name="subject" id="subject" placeholder="subject">
												</div>
											</div>
											<div class="col-md-12">
												<div class="form-group">
													<input type="time" class="form-control" name="time" id="time" placeholder="time">
												</div>
											</div>

											<div class="col-md-12">
												<div class="form-group">
													<input type="submit" value="submit" class="btn btn-primary">
													<div class="submitting"></div>
												</div>
											</div>
										</div>
									</form>
								</div>
							</div>
							<div class="col-md-6 d-flex align-items-stretch">

						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="{% static 'timetab/js/jquery.min.js' %}"></script>
  <script src="{% static 'timetab/js/popper.js' %}"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="{% static 'timetab/js/jquery.validate.min.js' %}"></script>
  <script src="{% static 'timetab/js/main.js' %}"></script>

	</body>
</html>
